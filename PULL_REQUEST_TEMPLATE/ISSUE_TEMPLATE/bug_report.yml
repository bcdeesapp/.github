name: 🐛 Bug Report
description: Something is broken or behaving unexpectedly
title: "fix(<scope>): <short description>"
labels: ["bug", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill this out as completely as possible.

  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      options:
        - Mobile App — Auth / Registration
        - Mobile App — KYC
        - Mobile App — Wallet / Deposits / Withdrawals
        - Mobile App — P2P Marketplace / Ads
        - Mobile App — Trade / Escrow Flow
        - Mobile App — In-Trade Chat
        - Back Office — KYC Review
        - Back Office — User Management
        - Back Office — Transaction / Ledger View
        - Back Office — Dispute Management
        - Back Office — Admin Roles / Access
        - API / Backend
        - Public Website
        - Infrastructure / Deployment
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What happened? What did you expect to happen?
      placeholder: "When I do X, Y happens. I expected Z."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Provide clear, numbered steps.
      placeholder: |
        1. Go to ...
        2. Do ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - Platform: Mobile (Android 14) / Mobile (iOS 17) / Web (Chrome 124)
        - App version / build:
        - Environment: Staging / Production
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Attach relevant logs, screenshots, or screen recordings. **Mask any PII before attaching.**
    validations:
      required: false

  - type: checkboxes
    id: security
    attributes:
      label: Security / Financial Impact
      options:
        - label: This bug could affect wallet balances, escrow, or financial integrity
        - label: This bug could affect KYC or user verification data
        - label: This bug could allow unauthorized access
